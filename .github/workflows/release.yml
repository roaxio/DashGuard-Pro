# Tag-triggered release: builds the release APK and attaches it to a GitHub release.
# Signed when the KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets are set,
# otherwise the APK is published unsigned (marked "-unsigned" in its name).
name: Release Publisher

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Job-level so the step `if:` below can see it (a step's own env is not visible to its `if:`).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Check tag matches versionName
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Releases must be built from a v*.*.* tag (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}')."
            exit 1
          fi
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v${VERSION_NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName \"${VERSION_NAME}\" in app/build.gradle.kts (expected tag v${VERSION_NAME})."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versionName ${VERSION_NAME}"

      - name: Decode Release Keystore (if secret is configured)
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_assets
          TAG_NAME="${GITHUB_REF_NAME}"
          OUT=app/build/outputs/apk/release
          if [ -f "$OUT/app-release.apk" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
            "$APKSIGNER" verify --print-certs "$OUT/app-release.apk"
            cp "$OUT/app-release.apk" "release_assets/DashGuard-Pro-${TAG_NAME}.apk"
          else
            echo "::warning::No signing secrets set; publishing an unsigned APK."
            cp "$OUT/app-release-unsigned.apk" "release_assets/DashGuard-Pro-${TAG_NAME}-unsigned.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release_assets/DashGuard-Pro-*
          generate_release_notes: true
          draft: false
          prerelease: false
