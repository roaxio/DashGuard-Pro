version: 2
updates:
  # Maintain GitHub Actions dependencies (bi-weekly on 1st & 15th, grouped into 1 PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
      timezone: "UTC"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"

  # Maintain Gradle dependencies in libs.versions.toml / build.gradle.kts (bi-weekly on 1st & 15th, grouped into architectural stages)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns:
          - "com.android.application*"
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "gradle-wrapper"
      coroutines-and-core:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "androidx.core*"
          - "androidx.test*"
      room-and-media:
        patterns:
          - "androidx.room*"
          - "androidx.media3*"
      compose-and-testing:
        patterns:
          - "androidx.compose*"
          - "androidx.navigation*"
          - "org.robolectric*"
          - "io.github.takahirom.roborazzi*"
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
